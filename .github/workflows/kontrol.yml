name: Kod ve veri kontrolleri

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Veri ve Python regresyonları
        run: |
          python3 src/veri.py
          python3 -m unittest discover -s tests -v
      - name: Demo üretimi
        run: python3 src/build_dashboard.py --site
      - name: Arayüz davranış kontrolleri
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Türetilmiş dosya ve boşluk denetimi
        run: |
          git diff --exit-code -- site/app.html
          git diff --check
