name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'data/**', 'config/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  kontrol:
    uses: ./.github/workflows/kontrol.yml
  deploy:
    needs: kontrol
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Yalnızca demo verisinden üret
        run: python3 src/build_dashboard.py --site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
